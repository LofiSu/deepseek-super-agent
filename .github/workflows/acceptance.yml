name: Live acceptance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to check out
        required: false
        default: main
      model_base:
        description: OpenAI-compatible base URL (no trailing slash)
        required: true
        default: https://api.deepseek.com/v1
      model_id:
        description: Model id to send
        required: true
        default: deepseek-chat
      gh_repo:
        description: Repo for the real GitHub issue/comment demo (must be writable)
        required: true
        default: LofiSu/deepseek-super-agent
      keep_issues:
        description: Keep demo issues open (1 = keep)
        required: false
        default: "0"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: live-acceptance-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: live test + real-channel demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install filesystem sandbox
        # Worker bash fails closed without sandbox-exec (macOS) or bwrap (Linux).
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-net -- /bin/true

      - name: Require live credentials
        env:
          DS_AGENT_API_KEY: ${{ secrets.DS_AGENT_API_KEY || secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.DS_AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ -z "${DS_AGENT_API_KEY:-}" ]; then
            echo "::error::Set the DS_AGENT_API_KEY (or DEEPSEEK_API_KEY) repository secret."
            exit 1
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Set the DS_AGENT_GH_TOKEN secret (repo-scoped token with issues:write)."
            exit 1
          fi

      - name: Live test suite
        env:
          # The test setup treats CI/GITHUB_ACTIONS as a signal to skip live tests.
          # This job exists to run them, so override both for this step only.
          CI: "false"
          GITHUB_ACTIONS: "false"
          DS_AGENT_API_BASE: ${{ inputs.model_base }}
          DS_AGENT_API_KEY: ${{ secrets.DS_AGENT_API_KEY || secrets.DEEPSEEK_API_KEY }}
          DS_AGENT_API_MODEL: ${{ inputs.model_id }}
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee acceptance-test.log

      - name: Real-channel demo (GitHub)
        env:
          DS_AGENT_API_BASE: ${{ inputs.model_base }}
          DS_AGENT_API_KEY: ${{ secrets.DS_AGENT_API_KEY || secrets.DEEPSEEK_API_KEY }}
          DS_AGENT_API_MODEL: ${{ inputs.model_id }}
          GH_TOKEN: ${{ secrets.DS_AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          DS_AGENT_GH_REPO: ${{ inputs.gh_repo }}
          DS_AGENT_GH_KEEP: ${{ inputs.keep_issues }}
        run: |
          set -o pipefail
          pnpm demo 2>&1 | tee acceptance-demo.log

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            acceptance-test.log
            acceptance-demo.log
            /tmp/ds-agent-live-e2e-logs/**
