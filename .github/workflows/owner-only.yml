name: Owner-only submissions

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  discussion:
    types: [created, reopened]
  discussion_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: owner-only-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.discussion.number || github.run_id }}
  cancel-in-progress: false

jobs:
  enforce:
    # The owner and installed GitHub Apps (for example CodeRabbit) are allowed.
    # Every other actor is closed, locked, dismissed, or deleted.
    # pull_request_target runs from the base branch, so a fork cannot alter this
    # script. This workflow never checks out or runs code from the pull request.
    if: ${{ github.actor != 'LofiSu' && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce owner-only submissions
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const event = context.eventName
            const payload = context.payload

            const closeAndLock = async (number) => {
              await github.rest.issues.update({ owner, repo, issue_number: number, state: 'closed' })
              await github.rest.issues.lock({ owner, repo, issue_number: number, lock_reason: 'spam' })
            }

            if (event === 'issues') {
              await closeAndLock(payload.issue.number)
            } else if (event === 'pull_request_target') {
              await closeAndLock(payload.pull_request.number)
            } else if (event === 'issue_comment') {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: payload.comment.id })
            } else if (event === 'pull_request_review_comment') {
              await github.rest.pulls.deleteReviewComment({ owner, repo, comment_id: payload.comment.id })
            } else if (event === 'pull_request_review') {
              await github.rest.pulls.dismissReview({
                owner,
                repo,
                pull_number: payload.pull_request.number,
                review_id: payload.review.id,
                message: 'Owner-only repository: external reviews are not accepted.',
              })
            } else if (event === 'discussion') {
              const discussionId = payload.discussion.node_id
              await github.graphql(
                'mutation($id: ID!) { closeDiscussion(input: {discussionId: $id}) { discussion { id } } }',
                { id: discussionId },
              )
              await github.graphql(
                'mutation($id: ID!) { lockLockable(input: {lockableId: $id, lockReason: SPAM}) { lockedRecord { id } } }',
                { id: discussionId },
              )
            } else if (event === 'discussion_comment') {
              await github.graphql(
                'mutation($id: ID!) { deleteDiscussionComment(input: {id: $id}) { comment { id } } }',
                { id: payload.comment.node_id },
              )
            } else {
              core.warning(`No handler for ${event}`)
            }
